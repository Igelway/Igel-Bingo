# IgelBingo Game Plugin Configuration
# ==========================================================================

# Countdown duration in seconds before game starts
countdown-seconds: 30

# Worldborder sizes
worldborder-overworld: 10000
worldborder-nether: 4000
worldborder-end: 8000

# Elytra and firework replenish settings
elytra-replenish-interval: 8   # seconds between firework replenish
elytra-replenish-amount: 64    # fireworks given per replenish (capped at 64 in slot 4)
