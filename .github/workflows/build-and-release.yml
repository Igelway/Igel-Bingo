name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-velocity-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build velocity plugin
        working-directory: igelbingo-velocity
        run: gradle build --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: igelbingo-velocity-jar
          path: igelbingo-velocity/build/libs/*.jar

  build-game-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build game plugin
        working-directory: igelbingo-game
        run: gradle build --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: igelbingo-game-jar
          path: igelbingo-game/build/libs/*.jar

  build-velocity-image:
    needs: build-velocity-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download velocity plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: igelbingo-velocity-jar
          path: igelbingo-velocity/build/libs/
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/igel-bingo-velocity
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.velocity
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-gameserver-image:
    needs: build-game-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download game plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: igelbingo-game-jar
          path: igelbingo-game/build/libs/
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/igel-bingo-gameserver
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gameserver
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    needs: [build-velocity-plugin, build-game-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download velocity plugin
        uses: actions/download-artifact@v4
        with:
          name: igelbingo-velocity-jar
          path: release/
      - name: Download game plugin
        uses: actions/download-artifact@v4
        with:
          name: igelbingo-game-jar
          path: release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.jar
          generate_release_notes: true
